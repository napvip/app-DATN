name: do_an_tot_nghiep_ho_tro_nuoi_ong
description: "BeeGuard - Ung dung ho tro nuoi ong thong minh"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # UI Components
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Icons
  lucide_icons: ^0.257.0

  # HTTP
  http: ^1.2.2

  # Utils
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_database: ^11.3.4

  # Scanning & Audio
  mobile_scanner: ^6.0.0
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # QR generation + save to gallery
  qr_flutter: ^4.1.0
  gal: ^2.3.2
  path_provider: ^2.1.4

  # SVG rendering (Google logo, illustrations)
  flutter_svg: ^2.0.10+1

  # Image Picker
  image_picker: ^1.1.2

  # Notifications & Settings
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  flutter_overlay_window: ^0.4.2

  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Build-time generators for launcher icon + native splash
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Sinh launcher icon Android/iOS từ assets có sẵn.
# Chạy:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F5B400"
  adaptive_icon_foreground: "assets/images/android_foreground.png"

# Sinh native splash screen (hiển thị trước khi Flutter engine xong).
# Chạy:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F5B400"
  image: "assets/images/beeguard_logo.png"
  android_12:
    color: "#F5B400"
    image: "assets/images/beeguard_logo.png"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - .env
