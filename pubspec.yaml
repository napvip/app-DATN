name: do_an_tot_nghiep_ho_tro_nuoi_ong
description: "BeeGuard - Ung dung ho tro nuoi ong thong minh"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # UI Components
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Icons
  lucide_icons: ^0.257.0

  # HTTP
  http: ^1.2.2

  # Utils
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_database: ^11.3.4

  # Scanning & Audio
  mobile_scanner: ^6.0.0
  audioplayers: ^6.1.0
  vibration: ^2.0.0

  # QR generation + save to gallery
  qr_flutter: ^4.1.0
  gal: ^2.3.2
  path_provider: ^2.1.4

  # Image Picker
  image_picker: ^1.1.2

  # Notifications & Settings
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  flutter_overlay_window: ^0.4.2

  # Environment variables
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - .env
